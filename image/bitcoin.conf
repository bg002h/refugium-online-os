signet=1
server=1
disablewallet=1
listen=0
listenonion=0
discover=0
natpmp=0
dns=0
dnsseed=0
fixedseeds=0
proxy=unix:/run/peer-filter/socks
proxyrandomize=0
blocksonly=1
prune=2048
dbcache=256
par=2
maxconnections=12
nosettings=1
nodebuglogfile=1
printtoconsole=0
[signet]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=38332
rpccookiefile=/run/bitcoin/.cookie
rpccookieperms=group
rpcwhitelist=__cookie__:getblockchaininfo,getblockhash,getconnectioncount,testmempoolaccept,getnetworkinfo,getpeerinfo,listwallets
rpcwhitelistdefault=1
