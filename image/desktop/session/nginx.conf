daemon off;
master_process off;
worker_processes 1;
pid /run/local-web/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /run/local-web/body;
    proxy_temp_path /run/local-web/proxy;
    fastcgi_temp_path /run/local-web/fastcgi;
    uwsgi_temp_path /run/local-web/uwsgi;
    scgi_temp_path /run/local-web/scgi;
    server {
        listen 127.0.0.1:8080;
        root /opt/refugium-desktop/esplora;
        location = /refugium-index-status.js { alias /usr/lib/refugium-online/desktop/index-status.js; }
        location ^~ /api/internal/ { return 403; }
        location ^~ /api/v1/internal/ { return 403; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location /api/ { proxy_pass http://127.0.0.1:3000/; }
        location / { try_files $uri $uri/ /index.html; }
    }
    server {
        listen 127.0.0.1:8081;
        root /opt/refugium-desktop/mempool/en-US;
        location = /refugium-index-status.js { alias /usr/lib/refugium-online/desktop/index-status.js; }
        location ^~ /api/internal/ { return 403; }
        location ^~ /api/v1/internal/ { return 403; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location /resources/ { root /opt/refugium-desktop/mempool; }
        location = /api/v1/ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_pass http://127.0.0.1:8999/;
        }
        location = /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_pass http://127.0.0.1:8999/;
        }
        location /api/v1/ { proxy_pass http://127.0.0.1:8999; }
        location /api/ { proxy_pass http://127.0.0.1:3000/; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
