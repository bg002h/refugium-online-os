chain=main
server=1
disablewallet=1
prune=0
assumevalid=0
listen=0
listenonion=0
discover=0
dnsseed=0
fixedseeds=0
dns=0
natpmp=0
proxy=unix:/run/main-peer/socks
proxyrandomize=0
blocksonly=1
dbcache=256
par=2
maxconnections=8
nodebuglogfile=1
printtoconsole=0
nosettings=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=8332
rpccookiefile=/run/archive/.cookie
rpcwhitelistdefault=1
rpcwhitelist=__cookie__:getblockchaininfo,getconnectioncount
rpcwhitelist=blockrelay:getblockchaininfo,getblockhash,submitblock
